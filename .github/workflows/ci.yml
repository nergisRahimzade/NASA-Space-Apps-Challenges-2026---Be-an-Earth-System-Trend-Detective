name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]  # ESD-D14-BE: a release tag gets its own green check
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest
      # ESD-D14-BE: pipeline -> real uvicorn server -> schema checks, on the committed data.
      - name: End-to-end test (live API)
        run: uv run --locked python -m earth_system_trend.e2e --live