[project]
name = "earth-system-trend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nergis", email = "nergisrahimzade123@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cartopy>=0.26.0",
    "dask[array]>=2026.8.0",
    "earthaccess>=0.19.0",
    "fastapi>=0.162.0",
    "matplotlib>=3.11.2",
    "metpy>=1.7.1",
    "netcdf4>=1.7.5",
    "numpy>=2.5.4",
    "openai>=3.36.0",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pymannkendall>=1.4.3",
    "requests>=2.34.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
    "xarray>=2026.9.0",
]

[project.scripts]
earth-system-trend = "earth_system_trend:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
